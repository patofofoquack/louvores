name: Atualizar catálogo de louvores
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atualizar-catalogo.yml'
      - 'scripts/importar_catalogo.py'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install requests beautifulsoup4
      - name: Importar 1530 títulos numerados e classificados
        run: python scripts/importar_catalogo.py
      - name: Publicar catálogo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza catálogo completo do Louvando"
            git push
          fi
